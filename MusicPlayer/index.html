<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-container">
    <!-- Now Playing Display -->
    <div class="album-art">
      <div class="disc" id="disc">🎵</div>
    </div>

    <div class="track-info">
      <h2 id="song-title">Loading...</h2>
      <p id="song-artist">Artist</p>
    </div>

    <!-- Progress Bar & Timestamps -->
    <div class="progress-section">
      <span id="current-time">0:00</span>
      <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" aria-label="Seek">
      <span id="total-duration">0:00</span>
    </div>

    <!-- Main Playback Controls -->
    <div class="controls">
      <button id="prev-btn" class="control-btn" aria-label="Previous">&#9198;</button>
      <button id="play-pause-btn" class="control-btn play-btn" aria-label="Play">&#9654;</button>
      <button id="next-btn" class="control-btn" aria-label="Next">&#9197;</button>
    </div>

    <!-- Volume & Autoplay Controls -->
    <div class="secondary-controls">
      <div class="volume-control">
        <button id="mute-btn" class="icon-btn" aria-label="Mute/Unmute">🔊</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>

      <label class="autoplay-toggle">
        <input type="checkbox" id="autoplay-checkbox" checked>
        <span>Autoplay</span>
      </label>
    </div>

    <!-- Playlist Section -->
    <div class="playlist-section">
      <h3>Playlist</h3>
      <ul id="playlist" class="playlist"></ul>
    </div>
  </div>

  <!-- Hidden HTML5 Audio Element -->
  <audio id="audio-player"></audio>

  <script src="script.js"></script>
</body>
</html>

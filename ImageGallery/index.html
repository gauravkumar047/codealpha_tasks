<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="gallery-header">
    <h1>Image Gallery</h1>
    <!-- Category Filter Buttons -->
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="wildlife">Wildlife</button>
      <button class="filter-btn" data-filter="vehicles">Vehicles</button>
      <button class="filter-btn" data-filter="space">Space</button>
    </div>
  </header>

  <!-- Gallery Grid (Populated automatically by script.js) -->
  <main id="gallery-grid" class="gallery-grid"></main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="close-btn" class="close-btn" aria-label="Close">&times;</button>
    <button id="prev-btn" class="nav-btn prev-btn" aria-label="Previous">&#10094;</button>
    
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Expanded view">
      <p id="lightbox-caption"></p>
    </div>
    
    <button id="next-btn" class="nav-btn next-btn" aria-label="Next">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
